[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "6.1.0"
description = "Deterministic, forecast-gated Polymarket weather trading engine"
readme = "README.md"
license = "MIT"
authors = [{ name = "Benoit Floc'h" }]
requires-python = ">=3.11"
keywords = ["polymarket", "weather", "forecasting", "trading", "prediction-markets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "eth-account>=0.13.7",
    "python-dotenv>=1.0.1",
    "py-clob-client>=0.21.0",
    "py-clob-client-v2>=1.0.1",
    "typer>=0.12",
    "certifi>=2026.4.22",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
pmbot = "polymarket_bot.main:app"

[project.urls]
Repository = "https://github.com/novogratz/polymarket-bot"
Issues = "https://github.com/novogratz/polymarket-bot/issues"
Documentation = "https://github.com/novogratz/polymarket-bot#readme"
Changelog = "https://github.com/novogratz/polymarket-bot/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["polymarket_bot*"]
exclude = ["tests*", "data*", "docs*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally sanitize POLYMARKET_* variables before importing the
# package; executable scripts resolve the repository root before local imports.
"tests/*" = ["E402", "E501"]
"scripts/*" = ["E402"]
