# Profile "tweet_b" — PROPOSED bot-2 replacement (2026-07-27): the TWEET-COUNT
# lane. Clone of grinder_b.toml with the weather lane swapped for the
# xtracker-backed tweet/post-count bracket lane. Same engine, same sizing,
# same exits — only the candidate set and the edge model change.
#
# Thesis: "Will <person> post N1-N2 tweets from <A> to <B>?" brackets resolve
# from a PUBLIC counter (xtracker.polymarket.com) that exposes post-level
# timestamps in real time — the same property that makes weather markets
# beatable. The bot buys heavily-favored "No" (occasionally "Yes") sides of
# brackets the count model says are near-certain, and rides to resolution.
# Model: hour-of-week Poisson intensity + 72h burst factor + negative-binomial
# tails, fitted per tick on the live feed that resolves the market
# (polymarket_bot/tweet_model.py). Deterministic — no LLM in the loop; the
# optional Ollama regime sidecar only writes a prior file offline.

[run]
# Baseline carried over from grinder_b (re-based 2026-06-27). Re-base with
# scripts/fresh_start.py when the lane goes live.
starting_cash = 27.0
mode = "grinder"

[sizing]
max_position_ceiling_usd = 0.0
max_position_ceiling_pct = 0.54
cash_floor_pct = 0.05
position_pct = 0.50
min_open_positions = 0
starter_trade_usd = 1.5
assumed_live_balance_usd = 27.0
max_trade_usd = 0.0
high_conviction_balance_fraction = 0.50

[market_filters]
min_liquidity_usd = 500.0
min_volume_usd = 300.0

[persistence]
enabled = false

[race]
# Entry window 24h — SAME-DAY MODE (user 2026-07-27: "i want things that are
# expiring the same day... as many bets as possible to use 100% of the
# account"). Every entry resolves within a day: weather settles each evening
# and tweet windows are only bought in their final 24h. A literal 4h window
# was measured EMPTY (weather batch settles ~16:00 UTC, and tweet brackets
# price out of the 0.85-0.94 band before their last hours — winners > 0.96
# hard cap), so 24h is the shortest window with real inventory. The 8-day
# mid-window tweet edges (+10-17 pts, capital parked for days) are given up
# by design. No laddering (max_hours_cap = 0 -> single window).
max_hours = 24.0
max_hours_cap = 0.0
daily_expiry_fallback = false
scan_limit = 750

# Weather-grade liquidity floors (weather books are thinner; tweet brackets
# clear these easily).
min_liquidity_usd = 50.0
min_volume_24h_usd = 200.0

# v4 entry band unchanged: buy heavy favorites 0.85-0.94, hard cap 0.96.
min_price = 0.85
max_price = 0.94
max_price_hard_cap = 0.96
crypto_min_price = 0.0
max_spread = 0.04

stake_usd = 1.0
# ── EQUAL-WEIGHT FULL DEPLOYMENT (same as grinder_b, user 2026-07-19) ────
full_deploy = true
full_deploy_max_position_pct = 0.05
full_deploy_redistribute_max_position_pct = 0.10
full_deploy_redistribute_min_lines = 10
fixed_stake_usd = 0.0
unban_all_markets = true

# WEATHER LANE ON alongside tweets (user 2026-07-27, same-day mode): the two
# lane flags COMPOSE — the candidate set is the UNION of weather and tweet
# markets, nothing else. Weather keeps grinder_b's proven Open-Meteo gates.
weather_only = true
weather_forecast_min_edge = 0.10
weather_min_bracket_margin_c = 2.0

# TWEET-COUNT lane ON: keep ONLY tweet/post-count bracket markets
# (is_tweet_market in models.py — the exact inverse of their hard ban) and
# gate every entry on the xtracker count model.
tweet_only = true
# Model-vs-ask edge gate: the model probability for the chosen outcome must
# beat the ask by ≥ 8 pts. Prototype calibration (2026-07-27, 9 months of
# elonmusk history, 192 rolling weekly windows) showed realized win rates
# within ±2 pts of model probability in the 0.85-0.95 band — an 8 pt margin
# absorbs that error band with room to spare. A market whose counting window
# can't be matched on xtracker is SKIPPED, never guessed.
tweet_min_edge = 0.08

category_min_samples = 20
category_disable_roi = -0.05
min_edge = 0.0
min_quality_score = 0.0
forecast_prior = 0.95
preferred_volume_usd = 5000.0
min_resolution_clarity = 60.0
stake_pct = 0.35
initial_stake_pct = 0.20
double_down_enabled = false
double_down_min_dip = 0.01
double_down_max_dip = 0.40
double_down_min_price = 0.60
max_orders_per_tick = 12
cash_floor_pct = 0.0

# Exit rules — unchanged from grinder_b: ride to resolution, winners exit at
# a real 0.99 bid, confirmed -30% SL applies to sport moneylines ONLY (i.e.
# never to a tweet bracket — a mid-window posting spree can crater a "No"
# that still resolves 1.0; the never-sell-below-entry floor holds it).
tp_pct = 1.0
sl_pct = 0.30
sl_confirm_ticks = 3
sl_min_age_minutes = 5
sl_min_exit_price = 0.50
near_expiry_minutes = 5
resolved_exit_threshold = 0.99
min_profit_margin = 0.02

arb_threshold = 0.0
arb_max_stake_usd = 5.0

[telemetry]
quiet = false
auto_interval_seconds = 30
stdout_heartbeat_minutes = 15

[filters]
max_orders_per_tick = 2
max_hours_to_close = 4.0
min_trade_usd = 1.0
max_absolute_spread = 0.02
max_relative_spread = 0.08
max_chase_premium = 0.03

[noise_fallback]
enabled = false

[btc_edge]
# ENABLED (user 2026-07-27 "do everything you can"): hourly BTC/ETH price-
# threshold markets, model-gated (Black-Scholes >= 75% + >= 5 pt edge over
# the market), $5 per-trade cap. Resolves every hour -> same-day turnover
# between weather/tweet batches. The one crypto lane past decisions sanction
# (the Up/Down coinflips stay excluded). Rollback: enabled = false.
enabled = true
min_model_probability = 0.75
min_edge_over_market = 0.05
min_buy_price = 0.75
max_buy_price = 0.97
max_spread = 0.04
min_trade_usd = 1.0
per_trade_cap_usd = 5.0
min_hours_to_close = 0.08
volatility_days = 7

[discovery]
soon_hours = 1

[crypto]
max_hours_to_close = 1.0

[execution]
max_entry_slippage = 0.02

[exits]
stop_loss_pct = 1.0
stop_loss_min_age_minutes = 1
max_hold_hours = 4.5
near_expiry_exit_losers = false
near_expiry_loser_minutes = 5
